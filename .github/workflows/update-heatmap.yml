name: Update Profile Heatmap

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch: # Allows you to manually click a button to run it

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: pip install requests beautifulsoup4
        
      - name: Generate new heatmap
        run: python scripts/make_heatmap.py
        
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-refresh contribution graph [skip ci]"
          file_pattern: "contrib-heatmap.svg"